<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Febri 記事アーカイブ索引</title>
<style>
  :root { --fg:#1a1a1a; --muted:#6b6b6b; --line:#e3e3e3; --accent:#b4232c; --bg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8e8; --muted:#9a9a9a; --line:#333; --accent:#ff6b72; --bg:#141414; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif; line-height:1.6; }
  .wrap { max-width:860px; margin:0 auto; padding:32px 20px 64px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .nav { display:flex; gap:4px; margin:0 0 16px; border-bottom:1px solid var(--line); }
  .nav a { font-size:14px; padding:8px 14px; color:var(--muted); text-decoration:none;
           border-bottom:2px solid transparent; margin-bottom:-1px; }
  .nav a:hover { color:var(--fg); }
  .nav a.on { color:var(--fg); font-weight:600; border-color:var(--accent); }
  .lead { color:var(--muted); font-size:13px; margin:0 0 20px; }
  .bar { display:flex; gap:8px; flex-wrap:wrap; }
  input[type=search] { flex:1 1 320px; font-size:16px; padding:10px 12px;
         border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  select { font-size:14px; padding:8px; border:1px solid var(--line); border-radius:6px;
         background:var(--bg); color:var(--fg); }
  .opts { margin:10px 0 0; font-size:13px; color:var(--muted); display:flex; gap:16px; flex-wrap:wrap; }
  .count { margin:20px 0 6px; font-size:13px; color:var(--muted); }
  ul { list-style:none; padding:0; margin:0; }
  li { display:flex; gap:16px; padding:9px 0; border-bottom:1px solid var(--line); align-items:baseline; }
  .date { flex:0 0 88px; font-variant-numeric:tabular-nums; color:var(--muted); font-size:14px; }
  .title { flex:1; }
  .title a { color:var(--fg); text-decoration:none; }
  .title a:hover { color:var(--accent); text-decoration:underline; }
  /* 分類バッジ：OKLCHで明度・彩度をそろえ、色相だけを等間隔にずらす */
  .cat { --h:260; font-size:11px; font-weight:600; letter-spacing:.02em;
         padding:1px 8px; margin-left:8px; border-radius:999px; white-space:nowrap;
         color:oklch(0.46 0.12 var(--h)); background:oklch(0.955 0.03 var(--h));
         box-shadow:inset 0 0 0 1px oklch(0.88 0.05 var(--h)); }
  @media (prefers-color-scheme: dark) {
    .cat { color:oklch(0.86 0.09 var(--h)); background:oklch(0.30 0.05 var(--h));
           box-shadow:inset 0 0 0 1px oklch(0.40 0.07 var(--h)); }
  }
  .writer { font-size:12px; color:var(--muted); margin-left:8px; white-space:nowrap; }
  .nosave { font-size:11px; color:var(--accent); margin-left:6px; white-space:nowrap; }
  .more { margin:20px auto; display:block; padding:8px 20px; font-size:14px; cursor:pointer;
         border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  .more[hidden] { display:none; }
  .err { color:var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav"><a href="index.html" class="on">記事検索</a><a href="series.html">連載一覧</a></nav>
  <h1>Febri 記事アーカイブ索引</h1>
  <p class="lead">アニメ情報サイト Febri（febri.jp、2026年11月25日閉鎖）の記事を、インターネットアーカイブの保存ページへのリンクとあわせてまとめた索引です。<span id="gen"></span></p>

  <div class="bar">
    <input type="search" id="q" placeholder="タイトル・著者名から検索（スペース区切りで AND）" autofocus>
    <select id="cat"><option value="">すべてのカテゴリ</option></select>
  </div>
  <div class="opts">
    <label><input type="checkbox" id="oldFirst"> 古い順</label>
  </div>

  <p class="count" id="count"></p>
  <ul id="list"></ul>
  <button class="more" id="more" hidden>さらに表示</button>
</div>

<script src="data.js?v=20261109-2"></script>
<script>
(() => {
  const PAGE = 200;
  const $ = id => document.getElementById(id);
  const data = window.FEBRI_DATA;
  if (!Array.isArray(data)) {
    $('count').innerHTML = '<span class="err">data.js が読み込めませんでした。build_index.py を実行して、このページと同じフォルダに data.js を置いてください。</span>';
    return;
  }
  const norm = s => s.normalize('NFKC').toLowerCase();
  data.forEach(x => { x._t = norm(x.t + ' ' + (x.w || '')); });

  const cats = [...new Set(data.map(x => x.c))].sort();
  cats.forEach(c => $('cat').add(new Option(c, c)));

  let results = [], shown = 0;

  const esc = s => s.replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  const fmt = d => d ? d.replace(/-/g, '.') : '----.--.--';

  // 分類ごとの色相（約45°間隔）。未知の分類は名前から色相を決める
  const HUES = { 'TOPICS':25, 'Febri TALK':250, 'SERIES':150, 'Febri TV':300,
                 'カタリベ':200, 'カバーアート':345 };
  const hue = c => {
    if (c in HUES) return HUES[c];
    let h = 0; for (const ch of c) h = (h * 31 + ch.codePointAt(0)) % 360;
    return h;
  };

  function row(x) {
    const href = x.a || ('https://web.archive.org/web/*/' + x.u);
    const flag = x.a ? '' : '<span class="nosave">未保存</span>';
    return `<li><span class="date">${fmt(x.d)}</span><span class="title"><a href="${esc(href)}" target="_blank" rel="noopener">${esc(x.t)}</a><span class="cat" style="--h:${hue(x.c)}">${esc(x.c)}</span>${x.w ? `<span class="writer">文／${esc(x.w)}</span>` : ''}${flag}</span></li>`;
  }

  function render(more) {
    if (!more) { $('list').innerHTML = ''; shown = 0; }
    const next = results.slice(shown, shown + PAGE);
    $('list').insertAdjacentHTML('beforeend', next.map(row).join(''));
    shown += next.length;
    $('more').hidden = shown >= results.length;
  }

  function search() {
    const terms = norm($('q').value).split(/\s+/).filter(Boolean);
    const cat = $('cat').value;
    results = data.filter(x =>
      (!cat || x.c === cat) && terms.every(t => x._t.includes(t))
    );
    if ($('oldFirst').checked) results = results.slice().reverse();
    $('count').textContent = `${results.length.toLocaleString()} 件 / 全 ${data.length.toLocaleString()} 件`;
    render(false);
  }

  let timer;
  $('q').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(search, 150); });
  ['cat', 'oldFirst'].forEach(id => $(id).addEventListener('change', search));
  $('more').addEventListener('click', () => render(true));
  search();
})();
</script>
</body>
</html>
