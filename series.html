<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>連載一覧｜Febri 記事アーカイブ索引</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDGothic:wght@400;700&display=swap&text=%21%22%23%24%25%26%27%28%29%2A%2B%2C-.%2F0123456789%3A%3B%3C%3D%3E%3F%40ABCDEFGHIJKLMNOPQRSTUVWXYZ%5B%5C%5D%5E_%60abcdefghijklmnopqrstuvwxyz%7B%7C%7D~">
<style>
  :root { --sans:"BIZ UDGothic","BIZ UDPGothic","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif; --fg:#1a1a1a; --muted:#6b6b6b; --line:#e3e3e3; --accent:#b4232c; --bg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#e8e8e8; --muted:#9a9a9a; --line:#333; --accent:#ff6b72; --bg:#141414; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font-family:var(--sans); line-height:1.6; }
  .wrap { max-width:860px; margin:0 auto; padding:32px 20px 64px; }
  .back { font-size:13px; color:var(--muted); text-decoration:none; }
  .back:hover { color:var(--accent); }
  h1 { font-size:22px; margin:8px 0 4px; }
  .nav { display:flex; gap:4px; margin:0 0 16px; border-bottom:1px solid var(--line); }
  .nav a { font-size:14px; padding:8px 14px; color:var(--muted); text-decoration:none;
           border-bottom:2px solid transparent; margin-bottom:-1px; }
  .nav a:hover { color:var(--fg); }
  .nav a.on { color:var(--fg); font-weight:600; border-color:var(--accent); }
  .lead { color:var(--muted); font-size:13px; margin:0 0 12px; }
  .toc { display:flex; gap:8px; flex-wrap:wrap; margin:0 0 8px; }
  .toc a { --h:150; font-size:13px; font-weight:600; padding:3px 12px; border-radius:999px; text-decoration:none;
         color:oklch(0.46 0.12 var(--h)); background:oklch(0.955 0.03 var(--h));
         box-shadow:inset 0 0 0 1px oklch(0.88 0.05 var(--h)); }
  details { margin-top:14px; }
  summary { list-style:none; cursor:pointer; }
  summary::-webkit-details-marker { display:none; }
  summary h2.sh::before { content:"▸"; display:inline-block; width:1.2em; color:var(--muted); transition:transform .15s; }
  details[open] summary h2.sh::before { transform:rotate(90deg); }
  summary:hover h2.sh { color:var(--accent); }
  .ctl { display:flex; gap:8px; margin:12px 0 0; }
  .ctl button { font-size:12px; padding:4px 12px; border-radius:6px; cursor:pointer;
         border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  .toc { flex-direction:column; gap:10px; }
  .toc-site { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .toc-site .site { font-size:12px; color:var(--muted); flex:0 0 84px; }
  .site-h { font-size:13px; color:var(--muted); margin:44px 0 -16px; letter-spacing:.1em; border:0; }
  h2.sh { --h:150; font-size:17px; margin:0 0 4px; padding-bottom:6px;
       border-bottom:2px solid oklch(0.85 0.07 var(--h)); }
  h2.sh .n { font-size:12px; font-weight:400; color:var(--muted); margin-left:8px; }
  @media (prefers-color-scheme: dark) {
    .toc a { color:oklch(0.86 0.09 var(--h)); background:oklch(0.30 0.05 var(--h));
             box-shadow:inset 0 0 0 1px oklch(0.40 0.07 var(--h)); }
    h2.sh { border-color:oklch(0.45 0.08 var(--h)); }
  }
  ol { list-style:none; padding:0; margin:0; }
  li { display:flex; gap:16px; padding:9px 0; border-bottom:1px solid var(--line); align-items:baseline; }
  .date { flex:0 0 88px; font-variant-numeric:tabular-nums; color:var(--muted); font-size:14px; }
  .title { flex:1; }
  .title a { color:var(--fg); text-decoration:none; }
  .title a:hover { color:var(--accent); text-decoration:underline; }
  .writer { font-size:12px; color:var(--muted); margin-left:8px; white-space:nowrap; }
  .nosave { font-size:11px; color:var(--accent); margin-left:6px; white-space:nowrap; }
  .foot { margin:48px 0 0; padding-top:16px; border-top:1px solid var(--line); font-size:12px; color:var(--muted); }
  .foot a { color:var(--muted); }
  .cbar { position:relative; display:flex; align-items:center; gap:12px; margin:20px 0 6px; }
  .cbar .count { flex:1; margin:0; }
  .about { margin-left:auto; }
  .about summary { list-style:none; cursor:pointer; display:flex; align-items:center; gap:6px; font-size:13px; color:var(--muted); white-space:nowrap; }
  .about summary::-webkit-details-marker { display:none; }
  .about .qi { width:20px; height:20px; border-radius:50%; border:1px solid var(--line); font-size:12px; font-weight:700;
         display:flex; align-items:center; justify-content:center; }
  .about[open] .qi, .about summary:hover .qi { color:var(--bg); background:var(--accent); border-color:var(--accent); }
  .aboutbox { position:absolute; left:0; right:0; top:calc(100% + 8px); z-index:10; background:var(--bg); border:1px solid var(--line);
         border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.12); padding:12px 14px; font-size:13px; color:var(--muted);
         max-height:70vh; overflow:auto; line-height:1.7; }
  .aboutbox .abh { font-weight:700; color:var(--fg); margin:0 0 6px; }
  .aboutbox h3 { font-size:13px; color:var(--fg); margin:12px 0 2px; }
  .aboutbox p { margin:0 0 4px; }
  .aboutbox ul { margin:0 0 4px; padding-left:1.2em; }
  .aboutbox li { display:list-item; padding:0; border:0; }
  .aboutbox a { color:var(--fg); }
  .count { font-size:13px; color:var(--muted); }
  .ug { display:block; position:sticky; top:0; background:var(--bg); font-size:13px; font-weight:700; color:var(--fg);
         padding:14px 0 4px; border-bottom:2px solid var(--fg); z-index:1; gap:0; }
  .ud { flex:0 0 44px; text-align:right; font-variant-numeric:tabular-nums; font-size:15px; font-weight:700; white-space:nowrap; color:var(--fg); }
  .ud small { font-size:10px; font-weight:400; color:var(--muted); margin-left:2px; }
  .ud .dq { font-size:11px; font-weight:400; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <nav class="nav"><a href="index.html">記事検索</a><a href="series.html" class="on">連載一覧</a></nav>
  <h1>Febri・アキバ総研・bonet 記事アーカイブ索引</h1>
  <div class="cbar"><p class="count" id="count"></p>
    <details class="about"><summary><span class="qi">?</span>このサイトについて</summary>
    <div class="aboutbox" id="aboutbox"></div></details></div>
  <nav class="toc" id="toc"></nav>
  <div class="ctl"><button id="openAll">すべて開く</button><button id="closeAll">すべて閉じる</button></div>
  <div id="list"></div>

  <footer class="foot">掲載内容の削除のご要望などは、X（<a href="https://x.com/bg75gf" target="_blank" rel="noopener">@bg75gf</a>）までご連絡ください。</footer>
</div>

<script src="about.js?v=20261117-1" data-page="series"></script>
<script src="series.js?v=20261110-3"></script>
<script src="akiba.js?v=20261126-1"></script>
<script src="bonet.js?v=20261115-1"></script>
<script>
(() => {
  const $ = id => document.getElementById(id);
  const akibaAll = (window.AKIBA_DATA || []).concat(window.AKIBA_EXTRA || []);
  const groups = (window.SERIES_DATA || []).map(g => ({ ...g, site: 'Febri' }))
    .concat((window.AKIBA_SERIES || []).map(g => ({ ...g, items: g.ids.map(i => akibaAll[i]) })),  // アキバ総研は記事を番号で指している
            window.BONET_SERIES || []);
  const sites = [...new Set(groups.map(g => g.site))];
  const esc = s => s.replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
  // 日付はアニメ制作決定ニュースと同じ形：月の見出し（画面上端に留める）＋各行は日にちと曜日
  const WD = '日月火水木金土';
  const day = (d, e) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || '');
    if (!m) return '<span class="dq">—</span>';
    if (e) return '<span class="dq">頃</span>';  // 記事番号から推定した日付は日にちを出さない
    return +m[3] + '<small>' + WD[new Date(+m[1], +m[2] - 1, +m[3]).getDay()] + '</small>';
  };
  const group = d => { const m = /^(\d{4})-(\d{2})/.exec(d || ''); return m ? m[1] + '年' + (+m[2]) + '月' : '日付なし'; };
  const HUES = [150, 25, 250, 300, 70, 200];

  $('toc').innerHTML = sites.map(site => `<div class="toc-site"><span class="site">${esc(site)}</span>` +
    groups.map((g, i) => g.site !== site ? '' :
      `<a href="#${esc(g.s)}" style="--h:${HUES[i % HUES.length]}">${esc(g.n)}</a>`).join('') + '</div>').join('');

  $('count').textContent = `連載 ${groups.length} 本 / ${groups.reduce((n, g) => n + g.items.length, 0).toLocaleString()} 件`;
  let lastSite = '';
  $('list').innerHTML = groups.map((g, i) => {
    const head = g.site !== lastSite ? `<h2 class="site-h">${esc(lastSite = g.site)}</h2>` : '';
    let lastG = '';
    const rows = g.items.map(x => {
      const mg = group(x.d), mh = mg !== lastG ? `<li class="ug">${esc(mg)}</li>` : '';
      lastG = mg;
      const href = x.a || ('https://web.archive.org/web/*/' + x.u);
      const flag = x.a ? '' : '<span class="nosave">未保存</span>';
      const w = x.w ? `<span class="writer">文／${esc(x.w)}</span>` : '';
      return mh + `<li><span class="ud">${day(x.d, x.e)}</span><span class="title"><a href="${esc(href)}" target="_blank" rel="noopener">${esc(x.t)}</a>${w}${flag}</span></li>`;
    }).join('');
    return head + `<details id="${esc(g.s)}"><summary><h2 class="sh" style="--h:${HUES[i % HUES.length]}">${esc(g.n)}<span class="n">${g.items.length} 本${g.items[0].d ? '　' + group(g.items[0].d) + '〜' : ''}</span></h2></summary><ol>${rows}</ol></details>`;
  }).join('');

  const all = () => [...document.querySelectorAll('#list details')];
  $('openAll').onclick = () => all().forEach(d => d.open = true);
  $('closeAll').onclick = () => all().forEach(d => d.open = false);
  // 目次から飛んだ連載は開いておく
  const openHash = () => {
    const d = location.hash && document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (d && d.tagName === 'DETAILS') { d.open = true; d.scrollIntoView(); }
  };
  window.addEventListener('hashchange', openHash);
  openHash();
})();
</script>
<script data-goatcounter="https://nzanke.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
